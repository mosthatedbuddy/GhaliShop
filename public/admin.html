  <!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin / GhaliShop</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section class="admin-login" id="admin-login"><a class="brand" href="index.html"><span class="brand-mark">G</span><span>Ghali<span>Shop</span></span></a><p class="eyebrow">Private workspace</p><h1>Store admin.</h1><p>Manage the collection from one quiet place.</p><form id="login-form"><label>Admin password<input id="admin-password" type="password" required autocomplete="current-password" placeholder="Enter password"></label><button class="button button-dark full-width" type="submit">Enter workspace <span>↗</span></button><p class="login-error" id="login-error">That password is not correct.</p></form><a class="back-store" href="index.html">← Back to store</a></section>
    <section class="admin-dashboard hidden" id="admin-dashboard"><header class="admin-header"><div><a class="brand" href="index.html"><span class="brand-mark">G</span><span>Ghali<span>Shop</span></span></a><p class="eyebrow">Control room</p><h1>Collection editor</h1></div><div class="admin-header-actions"><a class="button button-outline" href="index.html">View store ↗</a><button class="text-button" id="logout-button">Log out</button></div></header><div class="admin-layout"><aside class="admin-list"><div class="admin-list-head"><h2>Products</h2><span id="admin-product-count"></span></div><button class="new-product-button" id="new-product-button">+ Add new product</button><div id="admin-product-list"></div></aside><section class="editor-panel"><div class="editor-heading"><div><p class="eyebrow" id="editor-eyebrow">Edit product</p><h2 id="editor-title">Select a product</h2></div><button class="delete-button" id="delete-product-button">Delete product</button></div><form id="product-form" class="product-form"><div class="form-grid"><label>Product ID<input name="id" required placeholder="gs-016"></label><label>Product name<input name="name" required placeholder="Product name"></label><label>Price (MAD)<input name="price" required type="number" min="0" step="1"></label><label>Old price (MAD)<input name="oldPrice" type="number" min="0" step="1" placeholder="Leave empty if not on sale"></label><label>Category<select name="category"><option>Men</option><option>Women</option><option>Handbags</option><option>Backpacks</option><option>Sale</option></select></label><label>Discount (%)<input name="discount" type="number" min="0" max="99" step="1" placeholder="0"></label><label>Rating<input name="rating" type="number" min="0" max="5" step="0.1"></label><label>Stock status<input name="stock" required placeholder="In stock"></label><label class="wide">Description<textarea name="description" required rows="4" placeholder="Describe the product..."></textarea></label><label>Material<input name="material" required placeholder="Vegan leather"></label><label>Dimensions<input name="dimensions" required placeholder="30 x 20 x 10 cm"></label><label>Colors <span>(hex codes, comma separated)</span><input name="colors" required placeholder="#c6efff, #172121"></label><label>Sizes <span>(comma separated)</span><input name="sizes" required placeholder="One size"></label><label class="wide">Upload image files<input id="image-upload" type="file" accept="image/*" multiple></label><input type="hidden" name="images" value=""><div id="image-preview" class="image-preview" aria-live="polite"></div></div><div class="editor-actions"><button class="button button-dark" type="submit">Save product <span>↗</span></button><button class="button button-outline" type="button" id="cancel-edit-button">Cancel</button></div></form></section></div></section>
  </main><div class="toast" role="status" aria-live="polite"></div><script src="config.js"></script><script src="script.js"></script><script src="admin.js"></script>
</body>
</html>
